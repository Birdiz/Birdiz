services:
  mongo:
    image: mongo:7
    container_name: birdiz-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: birdiz

  api:
    build:
      context: ./api
    container_name: birdiz-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      CORS_ORIGIN: http://localhost:3000
      MONGO_URL: mongodb://mongo:27017/birdiz
    depends_on:
      - mongo

  web:
    build:
      context: ./web
    container_name: birdiz-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      API_BASE_URL: http://api:4000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
    depends_on:
      - api

volumes:
  mongo_data:
